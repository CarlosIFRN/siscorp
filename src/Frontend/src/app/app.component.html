<a class="skip-link" href="#main-content">Pular para o conteúdo</a>
@if (layout() === 'admin') {
  <div class="admin-shell" [class.sidebar-collapsed]="collapsed()">
    <aside class="admin-sidebar" [class.is-open]="mobileOpen()" id="admin-navigation">
      <a routerLink="/dashboard" class="admin-brand" aria-label="CWOS, dashboard"><span class="admin-brand-mark"><app-icon name="drop" /></span><span class="admin-brand-copy"><strong>CWOS</strong><small>GESTÃO DO LAVA-JATO</small></span></a>
      <div class="admin-workspace"><span class="online-dot"></span><span>Painel de gestão</span></div>
      <nav aria-label="Navegação principal"><span class="admin-nav-title">OPERAÇÃO</span><a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" class="admin-nav-link" aria-label="Dashboard"><app-icon name="dashboard" /><span>Dashboard</span></a><a routerLink="/agenda" routerLinkActive="active" ariaCurrentWhenActive="page" class="admin-nav-link" aria-label="Agenda"><app-icon name="calendar" /><span>Agenda</span></a></nav>
      <div class="admin-sidebar-bottom"><a routerLink="/agendar" class="admin-nav-link" aria-label="Formulário público"><app-icon name="link" /><span>Formulário público</span></a></div>
    </aside>
    @if (mobileOpen()) { <button type="button" class="admin-backdrop" (click)="mobileOpen.set(false)" aria-label="Fechar menu"></button> }
    <div class="admin-body"><header class="admin-topbar"><div><button type="button" class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-expanded]="!collapsed()" aria-controls="admin-navigation" [attr.aria-label]="mobileOpen() ? 'Fechar menu' : collapsed() ? 'Expandir sidebar' : 'Recolher sidebar'"><app-icon name="menu" /></button><span class="admin-breadcrumb">CWOS <app-icon name="chevron" /> {{ page() }}</span></div><div class="admin-topbar-right"><span class="online-dot"></span><span>Demonstração local</span><span class="admin-avatar">G</span></div></header><main id="main-content" [attr.inert]="mobileOpen() ? '' : null"><router-outlet /></main></div>
  </div>
} @else {
  <div id="main-content"><router-outlet /></div>
}
