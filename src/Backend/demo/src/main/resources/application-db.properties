spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cwos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
cwos.jwt.secret=${CWOS_JWT_SECRET}
cwos.auth.secure-cookie=true
cwos.auth.access-minutes=15
cwos.auth.refresh-days=7
