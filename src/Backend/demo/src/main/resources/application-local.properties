spring.datasource.url=jdbc:h2:file:./data/cwos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.address=127.0.0.1
cwos.bootstrap-admin.email=${CWOS_ADMIN_EMAIL:admin@cwos.local}
cwos.bootstrap-admin.password=${CWOS_ADMIN_PASSWORD:Admin123!}
cwos.jwt.secret=${CWOS_JWT_SECRET:cwos-local-only-2026-change-this-key}
cwos.auth.secure-cookie=false
cwos.auth.access-minutes=15
cwos.auth.refresh-days=7
